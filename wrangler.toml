# Cloudflare Pages configuration
# Deploys with: npx wrangler pages deploy dist
name = "ios-accounting-app"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

# KV storage for couple shared ledger sync.
# The /api/ledger/* Pages Functions require this binding named SHARED_LEDGER_KV;
# without it they fall back to per-isolate in-memory storage and data evaporates.
[[kv_namespaces]]
binding = "SHARED_LEDGER_KV"
id = "9b90cb18aa5d40a790118a89d17357b6"
